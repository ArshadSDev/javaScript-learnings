<!DOCTYPE html>
<html>
    <head>
        <title>Rock Paper scissors function</title>
        <link rel="stylesheet" href="rockPaperScissor-Final.css">
    </head>
    <body>
        <p class="heading">Rock Paper Scissors </p>

        <button class="move-button js-rock-button"><img src="images\rock-emoji.png" alt="" class="moves-image"></button>

        <button onclick="playGame('paper')" class="move-button js-paper-button"> <img src="images\paper-emoji.png" alt="" class="moves-image"> </button>

        <button onclick="playGame('scissors')" class="move-button js-scissors-button"><img src="images\scissors-emoji.png" alt="" class="moves-image"></button>

        <p class="JS-results results"></p>

        <p class="JS-Moves"></p>

        <p class="JS-Score score"></p>

        <button 
        class="reset-button js-reset-button" 
        >Reset score</button>


        <button class="auto-play-button js-autoplay-button" >Auto Play</button>
        


 <!-- <console class="log"></console> -->
        <script src="rockPaperScissor-Final.js">
        </script>
    </body>

</html>
